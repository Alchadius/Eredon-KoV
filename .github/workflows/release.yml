name: Build Windows installer
on:
  push:
    branches: [main]
    paths: ['app/**', '.github/workflows/release.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Install
        working-directory: app
        run: npm install
      - name: Build installer
        working-directory: app
        run: npx electron-builder --win nsis --x64 --publish never
      - name: Read version
        id: v
        shell: bash
        run: echo "ver=$(node -p "require('./app/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: app/dist/Eredon-KoV-Setup.exe
          tag_name: v${{ steps.v.outputs.ver }}
          target_commitish: ${{ github.sha }}
          name: Eredon KoV v${{ steps.v.outputs.ver }}
          make_latest: true
