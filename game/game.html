.xic{--tc:#888;position:relative;border:2px solid var(--tc);border-radius:9px;background:linear-gradient(#241c2c,#16101c);padding:8px 9px 9px;font-size:12px;line-height:1.35;min-width:0}
.xic.t2{box-shadow:0 0 12px #b06aff55}.xic.t3{box-shadow:0 0 16px #ff9a2a66}
.xic.empty{border:2px dashed #4a3c30;background:#120e18;color:var(--parch-dim);display:flex;align-items:center;justify-content:center;min-height:52px}
.xitier{font-size:10px;letter-spacing:.12em;color:var(--tc);font-weight:700}.xic b{display:block;color:var(--tc);font-size:14px;margin:2px 0 4px}
.xist{color:#d8ccaa}.xifx{margin-top:6px;padding:5px 6px;border-radius:5px;background:#ffffff10;border:1px solid var(--tc);color:#f0e6cc}.xifx i{display:block;font-style:normal;font-size:10px;letter-spacing:.14em;color:var(--tc);font-weight:700}
.xibt{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px}.xibt .btn{padding:4px 8px;font-size:11px;letter-spacing:0}
.hero header{flex-wrap:wrap}.pdoll{flex-basis:100%;display:flex;flex-wrap:nowrap;align-items:center;justify-content:center;gap:10px}
.pcol{display:flex;flex-direction:column;gap:10px}
.ptile{--tc:#4a3c30;width:54px;height:54px;border:2px solid var(--tc);border-radius:9px;background:linear-gradient(#241c2c,#16101c);display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;gap:1px}
.ptile svg{width:26px;height:26px}.ptile small{font-size:7px;color:var(--tc);letter-spacing:0;text-transform:uppercase;font-weight:700}
.ptile.t2{box-shadow:0 0 10px #b06aff66}.ptile.t3{box-shadow:0 0 14px #ff9a2a77}.ptile.sel{outline:2px solid #fff;outline-offset:2px}.ptile.empty{border-style:dashed;opacity:.6}
.bgrid{display:grid;grid-template-columns:repeat(4,52px);gap:8px;justify-content:center}.btile{width:52px;height:52px;position:relative}.btile.empty{opacity:.35;border-style:dashed;cursor:default}.blk{position:absolute;right:1px;top:-1px;font-size:10px;font-style:normal}
.bgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;width:100%}.ptile.bt{width:auto;height:46px}.ptile.bt svg{width:20px;height:20px}.ptile.bt.empty{opacity:.45;min-height:46px}
.hero header{background:linear-gradient(90deg,#0003,#0001),linear-gradient(90deg,var(--hc,#6b4220),#1a1412 85%)}
.hero header h3{color:#fff4d0;text-shadow:0 1px 3px #000,0 0 8px #000b}.hero header .rank{color:#f0e2b8;text-shadow:0 1px 3px #000,0 0 6px #000b}.hero header .dim,.hero header span.dim{color:#f4ead0;text-shadow:0 1px 3px #000,0 0 6px #000b}
.hero .abl{justify-content:center}.hero .abl span.abtn{background:#14100c!important;border:1px solid #8a6a2a;color:#f6ecd0;padding:4px 9px}.hero .abl span.abtn:hover{background:#241a12!important}.hero .abl kbd{background:#2a2018;color:#ffe27a;border:1px solid #8a6a2a;border-radius:3px;padding:0 5px;margin-right:2px;font-size:11px}

function tile(x,y){return(x<0||y<0||x>=MW||y>=MH)?1:G.g[y*MW+x];}

function nextLore(){const have=new Set();G.players.forEach(q=>q.ch.lore.forEach(i=>have.add(i)));const left=LORE.map((_,i)=>i).filter(i=>!have.has(i));return left.length?pick(left):-1;}
function giveLore(p){const i=nextLore();if(i<0)return;G.players.forEach(q=>{if(!q.ch.lore.includes(i))q.ch.lore.push(i);});toast('Lore found: '+LORE[i],'#e8d9a0',9);}
function updPick(dt){const np=[];G.pick=G.pick.filter(o=>{o.t+=dt;
  for(const p of G.players){if(p.down)continue;const d=dist(p,o);
    if(o.k==='gold'&&d<26){const gv=Math.max(1,Math.round(o.v*.75));p.ch.gold+=gv;G.score+=gv;sfx('gold');return false;}
    if(o.k==='heart'&&d<26){p.hp=Math.min(p.maxhp,p.hp+p.maxhp*.25);ring(o.x,o.y,30,'#ff7a8a');sfx('heart');return false;}
    if(o.k==='item'&&d<28){takeItem(p,o.src);return false;}
    if(o.k==='potion'&&d<26&&givePotion(p,o.pt)){sfx('item');return false;}
    if(o.k==='shrine'&&!o.open&&d<36){o.open=true;ring(o.x,o.y,90,'#9ad8ff');sfx('levelup');
      const r=Math.random();
      if(r<.25){addBuff(p,'dmg',1.3,90);toast('Shrine of Might: +30% damage for a while','#ffb36a');}
      else if(r<.5){p.hp=p.maxhp;addBuff(p,'def',.2,90);toast('Shrine of Vigor: fully healed and warded','#8aff9a');}
      else if(r<.75){addBuff(p,'haste',1,90);toast('Shrine of Wind: you move and strike faster','#9ad8ff');}
      else{for(let i=0;i<8;i++)np.push({k:'gold',x:o.x+rnd(-30,30),y:o.y+rnd(-30,30),v:ri(4,8)+G.depth*1.5,t:0});toast('Shrine of Fortune: gold pours out','#ffd34a');}
      return true;}
    if(o.k==='chest'&&!o.open&&d<30){o.open=true;sfx('chest');
      for(let i=0;i<(o.vault?7:4);i++)np.push({k:'gold',x:o.x+rnd(-22,22),y:o.y+rnd(-22,22),v:ri(3,6)+G.depth*1.2,t:0});
      if(Math.random()<(o.secret?.7:o.vault?.45:.08))np.push({k:'item',src:o.secret?'secret':'chest',x:o.x,y:o.y+20,t:0});

      if(o.secret||Math.random()<.35)giveLore(p);
      if(o.secret)G.score+=250;
      return true;}}
  return true;}).concat(np);}

function updPlayer(p,dt){
  if(p.away)return;
  if(p.down){const near=G.players.some(q=>q!==p&&!q.down&&dist(p,q)<46);if(near){p.rev+=dt;if(p.rev>=3){p.down=false;p.hp=p.maxhp*.4;p.rev=0;ring(p.x,p.y,70,'#7aff9a');toast(p.ch.name+' is back on their feet!','#7aff9a');sfx('revive');}}else p.rev=Math.max(0,p.rev-dt);return;}
  for(const k of Object.keys(p.b)){p.b[k].t-=dt;if(p.b[k].t<=0)delete p.b[k];}
  p.flash-=dt;p.slow-=dt;if(p.rootT>0)p.rootT-=dt;if(p.shapeT>0)p.shapeT-=dt;p.swing=Math.max(0,(p.swing||0)-dt);const c=CTRL[p.ctl!==undefined?p.ctl:p.idx]||CTRL[0];
  let mx=(K[c.r]?1:0)-(K[c.l]?1:0),my=(K[c.d]?1:0)-(K[c.u]?1:0);
  if(!p.remote&&(mx||my)){const l=Math.hypot(mx,my);mx/=l;my/=l;p.fx=mx;p.fy=my;const s=p.spd*(p.b.haste?1.35:1)*(p.slow>0?.6:1)*(p.rootT>0?0:1);moveE(p,mx*s*dt,my*s*dt);p.anim+=dt*9;if(p.ch.racial==='speed'){p.ftT=(p.ftT||0)-dt;if(p.ftT<=0){p.ftT=.09;spFx('foot',p.x,p.y,CLASSES[p.cls].col,0);}}}
  for(let i=0;i<3;i++){p.cds[i]=Math.max(0,p.cds[i]-dt);const a=CLASSES[p.cls].ab[i];if(a&&!p.remote&&K[c.a[i]]&&p.cds[i]<=0)useAbil(p,i);}
  if(p.ch.racial==='regen')p.hp=Math.min(p.maxhp,p.hp+dt);
  itemTick(p,dt);if(!p.remote){if(K[c.lg]&&p.use&&!(p.lcd>0))useLegend(p);if(K[c.po]&&p.ch.potion&&!(p.pcd>0))usePotion(p);}
  const tx=Math.floor(p.x/T),ty=Math.floor(p.y/T);
  for(let y=ty-6;y<=ty+6;y++)for(let x=tx-7;x<=tx+7;x++)if(x>=0&&y>=0&&x<MW&&y<MH)G.seen[y*MW+x]=1;}

const LOGO_SRC=''; // paste a data: URI or published image path here to use your own Knights of Valor logo
const ov=document.getElementById('ov'),ACT={};let COOP=false;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let HI=0,SEL={n:1,h:[{cls:'warrior',race:'human',g:'m',name:''},{cls:'mage',race:'elf',g:'f',name:''}]};
function show(h,bare){ov.innerHTML=h;ov.classList.toggle('scrim',!bare);}function hide(){ov.innerHTML='';}
const MAXCH=3,RK='kov_roster_v1';
function fixCh(c){if(!c||typeof c!=='object'||!CLASSES[c.cls])return null;c.g=c.g==='f'?'f':'m';if(!RACES[c.race]){c.race='human';c.racial=RACES.human.opts[0];}if(!RACIALS[c.racial])c.racial=RACES[c.race].opts[0];
  c.up=c.up||{vit:0,mig:0,swi:0,foc:0};c.items=c.items||{};cleanInv(c,c);c.lore=c.lore||[];c.best=c.best||0;c.gold=c.gold||0;c.xp=c.xp||0;c.lvl=c.lvl||1;if(!c.id)c.id=Math.random().toString(36).slice(2,10);return c;}
function loadSave(){try{let s=JSON.parse(localStorage.getItem(RK)||'null');
  if(!s){s={chars:[],hi:0};const old=JSON.parse(localStorage.getItem('kov_save_v1')||'null'),net=JSON.parse(localStorage.getItem('kov_net_char')||'null');
    if(old){s.hi=old.hi||0;(old.chars||[]).forEach(c=>s.chars.push(c));}if(net&&!s.chars.some(c=>c.name===net.name&&c.cls===net.cls))s.chars.push(net);
    s.chars=s.chars.map(fixCh).filter(Boolean).slice(0,MAXCH);try{localStorage.setItem(RK,JSON.stringify(s));}catch(e){}}
  s.chars=(s.chars||[]).map(fixCh).filter(Boolean).slice(0,MAXCH);return s;}catch(e){return{chars:[],hi:0};}}
function writeRoster(s){try{localStorage.setItem(RK,JSON.stringify(s));}catch(e){}}
function upsertChar(ch){fixCh(ch);const s=loadSave(),i=s.chars.findIndex(c=>c.id===ch.id);if(i>=0)s.chars[i]=ch;else if(s.chars.length<MAXCH)s.chars.push(ch);else return false;s.hi=Math.max(s.hi||0,HI);writeRoster(s);return true;}
function saveGame(){G.players.forEach(p=>upsertChar(p.ch));}
try{const s=loadSave();if(s&&s.hi)HI=s.hi;}catch(e){}
ov.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(b&&ACT[b.dataset.a]&&!b.disabled)ACT[b.dataset.a](b.dataset);});

ACT.new=()=>{COOP=false;SEL.coop=false;SEL.online=false;SEL.n=1;if(loadSave().chars.length>=MAXCH){fullScreen();return;}selectScreen();};ACT.online=()=>{COOP=false;SEL.coop=false;SEL.online=true;netHeroScreen();};
function fullScreen(){show('<div class="panel fade"><h2>Your roster is full</h2><p class="story">The Order keeps room for three heroes. Retire one in the Characters menu to make space.</p><div class="row"><button class="btn" data-a="chars">Characters</button><button class="btn alt" data-a="title">Back</button></div></div>');}
SEL.party=[];SEL.del=null;
function charsScreen(){const s=loadSave(),co=SEL.coop;let h='<div class="panel"><h2>'+(co?'Co-op: Choose Two Heroes':'Characters')+'</h2><p class="dim">'+(co?'Two heroes, one keyboard. Pick two heroes below ('+SEL.party.length+'/2 chosen), or create a new one. Hero 1 uses WASD and Hero 2 uses the arrow keys by default; change them under Controls.':'Your heroes and their progress are saved here. The Order holds up to three ('+s.chars.length+'/'+MAXCH+').')+'</p><div class="sheet">';
  for(let i=0;i<MAXCH;i++){const c=s.chars[i];
    if(!c){h+='<section class="hero" style="--hc:#3a3028"><div class="body" style="align-items:center;justify-content:center;min-height:180px"><h3 style="color:var(--parch-dim)">Empty Slot</h3><button class="btn alt" data-a="'+(co?'cnew':'new')+'">Create a Hero</button></div></section>';continue;}
    const C=CLASSES[c.cls],R=RACES[c.race],inP=SEL.party.includes(c.id),ni=SLOTS.filter(k=>c.items[k]).length;
    h+='<section class="hero" style="--hc:'+C.col+'"><header><canvas class="pt big" width="80" height="96" data-pc="'+c.cls+'" data-pr="'+c.race+(c.g==='f'?'|f':'')+'"></canvas><div><h3>'+esc(c.name)+'</h3><div class="rank">'+rankOf(c.lvl)+'</div><p class="dim">Level '+c.lvl+' '+R.name+' '+C.name+'</p></div>'+CREST+'</header><div class="body"><p class="dim" style="font-size:13px">Deepest floor '+c.best+' &middot; Gold '+Math.round(c.gold)+' &middot; Relics '+ni+'/4 &middot; Lore '+c.lore.length+'/'+LORE.length+'</p>'+
      '<div class="row" style="justify-content:flex-start">'+(co?'':'<button class="btn" style="padding:7px 12px;font-size:12px" data-a="cplay" data-id="'+c.id+'">Play</button>')+'<button class="btn alt" style="padding:7px 12px;font-size:12px" data-a="cparty" data-id="'+c.id+'">'+(inP?(co?'Chosen &#10003;':'In party'):(co?'Choose':'Add to party'))+'</button>'+
      '<button class="btn alt" style="padding:7px 12px;font-size:12px" data-a="csheet" data-id="'+c.id+'">Character Sheet</button><button class="btn alt" style="padding:7px 12px;font-size:12px" data-a="cdel" data-id="'+c.id+'">'+(SEL.del===c.id?'Really retire?':'Retire')+'</button></div></div></section>';}
  h+='</div><div class="row">'+(SEL.party.length===2?'<button class="btn" data-a="cduo">Play Together (2 players)</button>':'')+(co?'<button class="btn alt" data-a="ccontrols">Controls</button>':'')+'<button class="btn alt" data-a="title">Back</button></div></div>';
  show(h);paintPortraits();}
const byId=id=>loadSave().chars.find(c=>c.id===id);
ACT.chars=()=>{COOP=false;SEL.coop=false;SEL.party=[];SEL.del=null;charsScreen();};
ACT.cplay=d=>{const c=byId(d.id);if(c)beginRun([c],false);};
ACT.cparty=d=>{const i=SEL.party.indexOf(d.id);if(i>=0)SEL.party.splice(i,1);else{if(SEL.party.length>=2)SEL.party.shift();SEL.party.push(d.id);}charsScreen();};
ACT.ccontrols=()=>{SEL.from='coop';REBIND=null;settingsScreen();};
ACT.cduo=()=>{COOP=true;const cs=SEL.party.map(byId).filter(Boolean);if(cs.length===2)beginRun(cs,false);};
ACT.cdel=d=>{if(SEL.del===d.id){const s=loadSave();s.chars=s.chars.filter(c=>c.id!==d.id);writeRoster(s);SEL.party=SEL.party.filter(x=>x!==d.id);SEL.del=null;}else SEL.del=d.id;charsScreen();};

function abSvg(id,sz){const L=ABI[id]||ABI.slash;let h='<svg class="abic" viewBox="0 0 24 24" width="'+sz+'" height="'+sz+'" stroke-linejoin="round" stroke-linecap="round">';for(const e of L){const d=e[0],f=e[1],st=e[2],sw=e[3];const fill=(f&&f!=='none')?f:'none';let stroke,w;if(f!=='none'||st){stroke=st||'#120d0a';w=sw||1.5;}else{stroke='#120d0a';w=1.5;}h+='<path d="'+d+'" fill="'+fill+'" stroke="'+stroke+'" stroke-width="'+w+'"/>';}return h+'</svg>';}
function cardPop(inner,col){const old=document.getElementById('abcard');if(old)old.remove();const el=document.createElement('div');el.id='abcard';el.className='abcard';
  el.innerHTML='<div class="abc itpop" style="--hc:'+col+'">'+inner+'<div class="row"><button class="btn alt" data-x="1">Close</button></div></div>';
  el.addEventListener('click',e=>{const b=e.target.closest('[data-a]');el.remove();if(b&&!b.disabled&&ACT[b.dataset.a])ACT[b.dataset.a](b.dataset);});document.body.appendChild(el);}
ACT.abinfo=d=>{const C=CLASSES[d.cls],a=C&&C.ab[+d.s],CI=CLASS_INFO[d.cls]||{ab:[]};if(!a)return;
  const keys=['Primary Attack','Secondary Attack','Utility'],old=document.getElementById('abcard');if(old)old.remove();
  const el=document.createElement('div');el.id='abcard';el.className='abcard';
  el.innerHTML='<div class="abc" style="--hc:'+C.col+'"><h3 style="display:flex;align-items:center;gap:10px">'+abSvg(a.id,32)+esc(a.n)+'</h3><div class="abk">'+esc(C.name)+' &middot; '+keys[+d.s]+'</div><p>'+(CI.ab[+d.s]&&CI.ab[+d.s]!=='\u2014'?CI.ab[+d.s]:C.desc)+'</p><div class="abm"><span>Recharge <b>'+a.cd+'s</b></span><span>Role <b>'+esc(CI.role||'')+'</b></span><span>Range <b>'+esc(CI.range||'')+'</b></span></div>'+(CI.tip?'<p class="dim"><b>Tip:</b> '+esc(CI.tip)+'</p>':'')+'<div class="row"><button class="btn" data-x="1">Close</button></div></div>';
  el.addEventListener('click',()=>el.remove());document.body.appendChild(el);};
let CSEL={id:null};
ACT.csheet=d=>{const c=byId(d.id);if(!c)return;CSEL={id:d.id};const sv=G;let h;
  G={players:[makePlayer(c,0)],depth:0,view:1,selBag:null,selSlot:null,mode:'view'};
  try{h=sheetHTML();}finally{G=sv;}
  h=h.replace(/ data-a="bagsel"/g,' data-a="rbag"').replace(/ data-a="slotsel"/g,' data-a="rslot"').replace(/Click an item to equip, lock or sell it\. Gear changes only here or on the pause screen\./,'Click an item to see its details. Gear is changed in-game or on the pause screen.').replace(/<button class="btn" data-a="resume">Resume<\/button>/,'<button class="btn" data-a="chars">Back to roster</button>');
  show(h);paintPortraits();};
ACT.rbag=d=>{const c=byId(CSEL.id);if(!c)return;const it=(c.bag||[]).find(x=>x.id===d.id);if(it)cardPop(itemCard(c.cls,it,{}),TIER[it.tier].c);};
ACT.rslot=d=>{const c=byId(CSEL.id);if(!c)return;const it=c.items&&c.items[d.slot];if(it)cardPop(itemCard(c.cls,it,{eq:1}),TIER[it.tier].c);};
function RG(s){return s.race+(s.g==='f'?'|f':'');}
function createScreen(back,go){const s=SEL.h[0],C=CLASSES[s.cls],R=RACES[s.race];const sc=ov.querySelector('.panel'),st=sc?sc.scrollTop:0;
  let h='<div class="panel create"><h2>Create Your Hero</h2><div class="cbox cprev"><canvas class="pt big2" width="112" height="134" data-pc="'+s.cls+'" data-pr="'+RG(s)+'"></canvas><div><input type="text" id="nm0" maxlength="16" placeholder="Name (or leave blank for a random one)" value="'+esc(s.name)+'"><h3 style="margin-top:8px">'+(s.g==='f'?'Female ':'Male ')+R.name+' '+C.name+'</h3><p class="dim">'+C.desc+'</p><p class="dim">Racial gift, rolled at birth: <b style="color:var(--gold)">'+R.opts.map(o=>RACIALS[o][0]).join(' or ')+'</b></p><p class="dim" style="font-style:italic">'+(RACE_LORE[s.race]||'')+'</p></div></div>';
  const CI=CLASS_INFO[s.cls]||{ab:[]},RI=RACE_INFO[s.race]||{},bar=(l,v,mx,txt)=>'<div class="sb"><label>'+l+'</label><i><u style="width:'+Math.round(Math.min(1,v/mx)*100)+'%;background:'+C.col+'"></u></i><b>'+txt+'</b></div>',pips=n=>'<span class="pips">'+[1,2,3].map(i=>'<i class="pp'+(i<=n?' ppon':'')+'"></i>').join('')+'</span>';
  const keys=['Primary Attack','Secondary Attack','Utility'],abl=C.ab.map((a,i)=>a?'<li><b>'+a.n+'</b> <i class="ak">'+keys[i]+' &middot; '+a.cd+'s recharge</i><div class="ad">'+(CI.ab[i]||'')+'</div></li>':'').join('');
  h+='<div class="cbox cdet"><div class="dcol"><h3 class="cth" style="color:'+C.col+'">'+C.name+'</h3><div class="chips"><span>'+CI.role+'</span><span>'+CI.range+'</span><span>Difficulty '+pips(CI.diff||1)+'</span></div><p class="dim">'+(CI.lore||'')+'</p>'
   +bar('Health',C.hp,140,C.hp+' <small>+9/lvl</small>')+bar('Speed',C.spd-110,70,C.spd)+bar('Damage',C.dmg,13,C.dmg+' <small>+1.6/lvl</small>')
   +'<ul class="abl">'+abl+'</ul><p class="dim"><b class="g">+</b> '+(CI.pros||'')+'<br><b class="r">&minus;</b> '+(CI.cons||'')+'<br><b>Tip:</b> '+(CI.tip||'')+'</p></div>'
   +'<div class="dcol"><h3 class="cth">'+R.name+'</h3><div class="chips"><span>'+(RI.home||'')+'</span></div><p class="dim">'+(RI.lore||'')+'</p><p class="dim"><b>Racial gifts</b> &mdash; each hero is born with one, chosen at random:</p><ul class="abl">'+R.opts.map(o=>'<li><b>'+RACIALS[o][0]+'</b><div class="ad">'+RACIALS[o][1]+'</div></li>').join('')+'</ul><p class="dim"><b class="g">+</b> '+(RI.pros||'')+'<br><b>Pairs well with:</b> '+(RI.fits||'')+'</p></div></div>';
  h+='<div class="cbox"><h3 class="cth">Choose Your Hero</h3><div class="grid cgrid">'+['m','f'].map(v=>'<button class="card'+((s.g||'m')===v?' on':'')+'" data-a="gen" data-i="0" data-v="'+v+'"><canvas class="pt ic" width="128" height="128" data-ic="gen:'+v+'"></canvas><div class="ct"><b>'+(v==='f'?'Female':'Male')+'</b><span>'+(v==='f'?'A heroine of Eredon.':'A hero of Eredon.')+'</span></div></button>').join('')+'</div></div><div class="cbox"><h3 class="cth">Choose a Class</h3><div class="grid cgrid">';
  for(const k in CLASSES)h+='<button class="card'+(s.cls===k?' on':'')+'" data-a="cls" data-i="0" data-v="'+k+'" style="--cc:'+CLASSES[k].col+'"><canvas class="pt ic" width="128" height="128" data-ic="cls:'+k+'"></canvas><div class="ct"><b>'+CLASSES[k].name+'</b><span>'+CLASSES[k].desc+'</span></div></button>';
  h+='</div></div><div class="cbox"><h3 class="cth">Choose a Race</h3><div class="grid cgrid">';
  for(const k in RACES)h+='<button class="card'+(s.race===k?' on':'')+'" data-a="race" data-i="0" data-v="'+k+'"><canvas class="pt ic" width="128" height="128" data-ic="race:'+k+'"></canvas><div class="ct"><b>'+RACES[k].name+'</b><span>Gifts: '+RACES[k].opts.map(o=>RACIALS[o][0]).join(' / ')+'</span></div></button>';
  show(h+'</div></div><div class="row"><button class="btn alt" data-a="'+back+'">Back</button><button class="btn" data-a="'+go+'">'+(go==='go'?(SEL.coop?'Add Hero to Party':'Begin the Quest'):'Continue')+'</button></div></div>');
  paintPortraits();const np=ov.querySelector('.panel');if(np)np.scrollTop=st;}
function selectScreen(){createScreen('back','go');}
ACT.gen=d=>{SEL.h[+d.i].g=d.v==='f'?'f':'m';SEL.online?netSelect():selectScreen();};ACT.cls=d=>{SEL.h[+d.i].cls=d.v;SEL.online?netSelect():selectScreen();};ACT.race=d=>{SEL.h[+d.i].race=d.v;SEL.online?netSelect():selectScreen();};ACT.back=()=>SEL.coop?charsScreen():titleScreen();
ACT.go=()=>{const chars=SEL.h.slice(0,1).map(h=>newChar(h.cls,h.race,h.name,h.g));chars.forEach(c=>upsertChar(c));if(SEL.coop){if(SEL.party.length>=2)SEL.party.shift();SEL.party.push(chars[0].id);charsScreen();return;}beginRun(chars,true);};

function story(paras,done,title){let i=0;const render=()=>{show('<div class="panel fade">'+(title&&paras[i].indexOf('class="paint"')<0?'<h2>'+title+'</h2>':'')+'<p class="story">'+paras[i]+'</p><div class="row"><button class="btn" data-a="snext">'+(i<paras.length-1?'Next':'Continue')+'</button>'+(paras.length>1?'<button class="btn alt" data-a="sskip">Skip</button>':'')+'</div></div>');paintAll(ov);};
  ACT.snext=()=>{i++;if(i>=paras.length){hide();done();}else render();};ACT.sskip=()=>{hide();done();};render();}

function beginRun(chars,intro){G={players:chars.map((c,i)=>makePlayer(c,i)),score:0,toasts:[],mode:'story'};
  const go=()=>preLevel(1);if(intro)story(INTRO,go,'The Tale Begins');else go();}
function preLevel(d){startLevel(d);G.mode='story';
  const t=[DEPTH_STORY[d]||'The deeper halls shift and rearrange themselves while you sleep. Something older than Kaldoris is taking an interest.'];
  if(G.isBoss)t.push('A great presence waits at the end of this level. Gather your party. Do not go in alone.');
  musicPlay('b'+G.bi);t[0]=sceneTag(levelScene(d),G.biome.n)+t[0];story(t,()=>{G.mode='play';last=performance.now();},G.biome.n);}

function cost(n){return Math.round(30*Math.pow(1.5,n));}
const UPS={vit:['Vitality','+12 max health'],mig:['Might','+2 damage'],swi:['Swiftness','+4% move speed'],foc:['Focus','abilities recharge 4% faster']};
function levelDoneScreen(){musicPlay('title');sfx('stairs');const d=G.depth;G.players.forEach(p=>{p.ch.best=Math.max(p.ch.best,d);});HI=Math.max(HI,G.score);saveGame();
  let h='<div class="panel"><h2>Depth '+d+' cleared</h2>'+(VICTORY[d]?(VSC[d]?sceneTag(VSC[d],'',1):'')+'<p class="story">'+VICTORY[d]+'</p>':'<p class="dim">The way down is open. Rest, spend your gold, and heal up a little between floors.</p>')+'<p>Score <b>'+G.score+'</b></p><div class="sheet">';
  G.players.forEach((p,i)=>{const ch=p.ch;h+='<section><h3>'+esc(ch.name)+' &middot; Lv '+ch.lvl+' &middot; '+Math.round(ch.gold)+' gold</h3><div class="row" style="justify-content:flex-start;margin-top:8px">';
    for(const u in UPS){const c=cost(ch.up[u]);h+='<button class="btn alt" style="font-size:12px;padding:6px 10px" data-a="buy" data-i="'+i+'" data-u="'+u+'"'+(ch.gold<c?' disabled':'')+'>'+UPS[u][0]+' ('+ch.up[u]+') &middot; '+c+'g<br><span style="text-transform:none;font-weight:400">'+UPS[u][1]+'</span></button>';}
    h+='</div></section>';});
  show(h+'</div><div class="row"><button class="btn" data-a="descend">Descend to Depth '+(d+1)+'</button></div></div>');paintAll(ov);}
ACT.buy=d=>{const p=G.players[+d.i],ch=p.ch,c=cost(ch.up[d.u]);if(ch.gold<c)return;ch.gold-=c;ch.up[d.u]++;recalc(p);if(d.u==='vit')p.hp+=12;saveGame();levelDoneScreen();};
ACT.descend=()=>{hide();preLevel(G.depth+1);};

function overScreen(){musicPlay('over');HI=Math.max(HI,G.score);saveGame();
  show('<div class="panel fade"><h2>The party has fallen</h2><p class="story">The torches gutter out. Somewhere far below, Queen Emily waits a little longer. Your heroes keep their levels, gold and treasure.</p><p>Final score <b>'+G.score+'</b> &middot; Best '+HI+' &middot; Reached depth '+G.depth+'</p><div class="row"><button class="btn" data-a="retry">Try Again</button><button class="btn alt" data-a="sheet">Character Sheet</button><button class="btn alt" data-a="title">Title</button></div></div>');}
ACT.retry=()=>{const ch=G.players.map(p=>p.ch);hide();beginRun(ch,false);};ACT.title=()=>titleScreen();

  return h+'</div><div class="row"><button class="btn" data-a="resume">Resume</button></div></div>';}
const LORE_ART=[

function paintPortraits(){ov.querySelectorAll('canvas.pt').forEach(c=>c.dataset.ic?drawIcon(c,c.dataset.ic.split(':')[0],c.dataset.ic.split(':')[1]):portrait(c,c.dataset.pc,c.dataset.pr));}
ACT.sheet=()=>{const fo=G.mode==='overUI';G.back=fo?'over':'play';G.mode=fo?'overUI':'sheet';show(sheetHTML());paintPortraits();};
ACT.resume=()=>{if(G&&G.net){NET.sheet=false;hide();return;}if(G.back==='over'){overScreen();G.back=null;return;}hide();G.mode='play';last=performance.now();};
ACT.quit=()=>{saveGame();titleScreen();};
function pauseScreen(){G.mode='pause';show('<div class="panel"><h2>Paused</h2><div class="row"><button class="btn" data-a="resume">Resume</button><button class="btn alt" data-a="sheet">Character Sheet</button><button class="btn alt" data-a="settings">Settings &amp; Controls</button><button class="btn alt" data-a="quit">Save &amp; Quit</button></div></div>');}

// ---------- input + loop ----------
addEventListener('keydown',e=>{const c=e.code;if(REBIND){e.preventDefault();if(!e.repeat)rebindKey(c);return;}if(e.target&&e.target.tagName==='INPUT')return;if(NET.on)netAlias(c,true);
  if(G&&G.mode==='play'&&(/^(Arrow|Space)/.test(c)||CTRL.some(q=>q.u===c||q.d===c||q.l===c||q.r===c||q.a.includes(c))))e.preventDefault();
  K[c]=true;
  if(c===KEYS.music&&!e.repeat){auInit();setAudio('m',!AU.on.m);}
  if(!G||e.repeat)return;
  if(G.net){if(c===KEYS.sheet&&G.mode!=='story'&&G.mode!=='done')netSheet();return;}
  if((c===KEYS.pause||c==='Escape')&&G.mode==='play')pauseScreen();
  else if((c===KEYS.pause||c==='Escape')&&G.mode==='pause'){ACT.resume();}

function itemStats(it){const b=IBASE[it.slot][it.tier],f=Math.max(.5,Math.min(2.4,1+.12*(it.lvl-8)))*it.r,fp=Math.min(f,1.5),o={};
  for(const k in b){const pct=(k==='crit'||k==='haste'||k==='dr');o[k]=k==='regen'?b[k]:Math.max(1,Math.round(b[k]*(pct?fp:f)));}return o;}
function itemInfo(cls,it){let name,fx=null,cd=0;const si=SLOTS.indexOf(it.slot);

function mkItem(cls,depth,tier){tier=tier|0;const slot=pick(SLOTS);return{id:uid(),slot,tier,lvl:Math.max(1,depth|0),r:+(.9+RNG()*.2).toFixed(2),lock:0,fav:0,cls};}
const TW={chest:[78,19,2.7,.3],secret:[46,42,11,1],kill:[84,15,1.3,.15],boss:[52,43,4.3,.3]};
function rollTier(src,luck,depth){const w=(TW[src]||TW.chest).slice(),bn=(1+.03*(depth||1))*(luck||1);w[2]*=bn;w[3]*=bn;const tot=w[0]+w[1]+w[2]+w[3];let r=Math.random()*tot;for(let i=0;i<4;i++){r-=w[i];if(r<0)return i;}return 0;}

// ----- sanitising / conversion of saved or received items -----
function legacyItem(r,cls,slot){const pw=clampN(r.power,1,60,1);return{id:uid(),slot,tier:pw<=3?0:pw<=5?1:2,lvl:Math.max(1,Math.round(pw*2)),r:1,lock:0,fav:0,cls};}
function cleanItem(r,cls,slot){if(!r||typeof r!=='object')return null;
  if(typeof r.tier!=='number'){return SLOTS.includes(slot)&&typeof r.power==='number'?legacyItem(r,cls,slot):null;}
  const sl=SLOTS.includes(r.slot)?r.slot:null;if(!sl)return null;let tier=Math.floor(clampN(r.tier,0,3,0));
  return{id:String(r.id||uid()).replace(/[^\w]/g,'').slice(0,10)||uid(),slot:sl,tier,lvl:Math.floor(clampN(r.lvl,1,60,1)),r:clampN(r.r,.9,1.1,1),lock:r.lock?1:0,fav:r.fav?1:0,cls};}
function cleanInv(o,c){const cls=o.cls,ci=c.items,cb=c.bag,cp=c.potion;c={items:ci,bag:cb};o.potion=cleanPot(cp);o.items={};o.bag=[];const seen=new Set();let leg=0;const extra=[];
  if(c.items&&typeof c.items==='object')for(const s of SLOTS){const it=cleanItem(c.items[s],cls,s);if(!it||it.slot!==s||seen.has(it.id))continue;seen.add(it.id);
    if(isPow(it)){if(leg){extra.push(it);continue;}leg=1;}o.items[s]=it;}
  const src=(Array.isArray(c.bag)?c.bag:[]).concat([]);
  for(const r of src){const it=cleanItem(r,cls,null);if(!it||seen.has(it.id))continue;seen.add(it.id);o.bag.push(it);}
  for(const it of extra)o.bag.push(it);o.bag=o.bag.slice(0,BAGMAX);return o;}

// ----- giving, selling, swapping -----
function tierToast(p,it,verb){const T=TIER[it.tier],inf=itemInfo(p.ch.cls,it);toast(p.ch.name+' '+verb+' '+T.n+': '+inf.name+(it.tier>=2?'':''),T.c,it.tier>=2?7:4);}
function sellItem(p,it){const g=TIER[it.tier].g;p.ch.gold+=g;return g;}
function equipFresh(p,it){const ch=p.ch,old=ch.items[it.slot];ch.items[it.slot]=it;
  if(isPow(it)){const o2=SLOTS.map(s=>ch.items[s]).find(x=>isPow(x)&&x.slot!==it.slot);if(o2){delete ch.items[o2.slot];ch.bag.push(o2);}}
  recalc(p);return old;}
function giveItem(p,it){const ch=p.ch;if(!ch.bag)ch.bag=[];const cur=ch.items[it.slot],T=TIER[it.tier];
  const flair=()=>{ring(p.x,p.y,it.tier===3?130:80,T.c);sfx('item');if(it.tier===3){G.shake=Math.max(G.shake||0,10);spFx('luck',p.x,p.y,T.c,0);}};

    if(old.tier>=2){if(ch.bag.length<BAGMAX)ch.bag.push(old);else{const g=sellItem(p,old);toast('Bag full: sold '+itemInfo(ch.cls,old).name+' for '+g+' gold.',TIER[old.tier].c);}}
    else{const g=sellItem(p,old);toast('Sold the old '+itemInfo(ch.cls,old).name+' for '+g+' gold.','#d8c8a0');}flair();return;}
  if(it.tier<2){ // raw-stat items: keep only real upgrades
    if(it.tier===cur.tier&&itemScore(it)>itemScore(cur)){const old=equipFresh(p,it);const g=sellItem(p,old);toast(p.ch.name+' upgrades to '+itemInfo(ch.cls,it).name+' (sold old for '+g+'g)',T.c,4);flair();return;}

  if(ch.bag.length<BAGMAX&&canAsk()){lootPrompt(p,it);return;}
  if(ch.bag.length<BAGMAX){ch.bag.push(it);tierToast(p,it,'found');toast('Added to the item bag. Open the character sheet to change gear.',T.c,4);flair();return;}

  bagPrompt(p,it);}

function autoFull(p,it){const ch=p.ch;let w=null;for(const x of ch.bag){if(x.lock||x.tier>it.tier)continue;if(!w||x.tier<w.tier||(x.tier===w.tier&&itemScore(x)<itemScore(w)))w=x;}
  if(w){ch.bag.splice(ch.bag.indexOf(w),1);const g=sellItem(p,w);ch.bag.push(it);tierToast(p,it,'found');toast('Bag full: sold '+itemInfo(ch.cls,w).name+' for '+g+' gold.',TIER[w.tier].c);ring(p.x,p.y,80,TIER[it.tier].c);sfx('item');}
  else{const g=sellItem(p,it);toast('Bag full: sold the new '+itemInfo(ch.cls,it).name+' for '+g+' gold.','#d8c8a0');}}
function takeItem(p,src,tier){const luck=p.ch.racial==='luck'?1.4:1;const t=tier===undefined?rollTier(src||'chest',luck,G.depth):tier;giveItem(p,mkItem(p.cls,G.depth,t));}
function doSwap(p,id){const ch=p.ch,i=ch.bag.findIndex(x=>x.id===id);if(i<0)return false;const it=ch.bag[i],old=ch.items[it.slot];let o2=null;
  if(isPow(it))o2=SLOTS.map(s=>ch.items[s]).find(x=>isPow(x)&&x.slot!==it.slot);
  if(ch.bag.length-1+(old?1:0)+(o2?1:0)>BAGMAX){toast('Free a bag slot first.','#ff9a8a');return false;}
  ch.bag.splice(i,1);if(old)ch.bag.splice(i,0,old);
  ch.items[it.slot]=it;if(o2){delete ch.items[o2.slot];ch.bag.push(o2);}return true;}
function applySwap(p,ids){let n=0;for(const id of ids)if(doSwap(p,id))n++;if(n){recalc(p);ring(p.x,p.y,70,'#d8c8a0');sfx('item');toast(p.ch.name+' changes gear.','#d8c8a0',2.5);}}
function reqSwap(p,ids){if(!ids.length)return'none';if(G&&G.net&&G.mode==='play'&&G.boss&&G.boss.aggro&&!G.boss.dead){toast('No time to change gear: a boss is upon you!','#ff7a6a');return'no';}
  applySwap(p,ids);return'done';}
function bagApply(p,a,id){const ch=p.ch;if(!ch.bag)ch.bag=[];
  if(a==='un'){const w=ch.items[id];if(!w)return'none';if(G&&G.net&&G.mode==='play'&&G.boss&&G.boss.aggro&&!G.boss.dead){toast('No time to change gear: a boss is upon you!','#ff7a6a');return'no';}
    if(ch.bag.length>=BAGMAX){toast('Bag is full. Sell or free a slot first.','#ff9a8a');return'no';}
    delete ch.items[id];ch.bag.push(w);recalc(p);p.hp=Math.min(p.hp,p.maxhp);ring(p.x,p.y,60,'#d8c8a0');sfx('item');G.selSlot=null;G.selBag=(G.net?0:(G.players.indexOf(p)))+':'+w.id;return'done';}

ACT.bagsel=d=>{if(!G)return;const p=G.net?G.local:G.players[d.pi|0];if(!p)return;const it=(p.ch.bag||[]).find(x=>x.id===d.id);if(it)cardPop(itemCard(p.ch.cls,it,{bag:1,pi:d.pi}),TIER[it.tier].c);};
function bagBlock(p,i){const ch=p.ch,bag=ch.bag||[];let sel='';const sk=G.selBag&&G.selBag.split(':');

function bagPrompt(p,it){if(G.bq){(G.bqQ=G.bqQ||[]).push([p,it]);return;}G.bq={p,it};G.back='play';G.mode='sheet';const ch=p.ch;

// ----- shared helpers for procs -----
const ist=p=>p.st||(p.st={});
function later(t,fn){if(!G.tq)G.tq=[];G.tq.push({t,fn});}
function shotMod(p,o){const m=p.smod||(p.smod={mul:1});if(o.mul)m.mul*=o.mul;if(o.crit)m.crit=1;if(o.pierce)m.pierce=o.pierce;if(o.big)m.big=1;}
function shootAng(p,o,ang){const fx=p.fx,fy=p.fy,c=Math.cos(ang),s=Math.sin(ang);p.fx=fx*c-fy*s;p.fy=fx*s+fy*c;shoot(p,o);p.fx=fx;p.fy=fy;}
function aliveFoes(){return G.enemies.filter(e=>!e.dead);}
function dmgMul(p){const s=ist(p);let m=1;if(s.rage&&s.rageT>0)m*=1+.04*s.rage;if(p.pr&&p.pr.weapon&&p.cls==='druid'&&s.season===1)m*=1.25;return m;}
function cdOK(s,k,t,now){if((s[k]||0)>0)return false;s[k]=t;return true;}
function zone(p,x,y,r,t,dps,col,slow){if(!G.zn)G.zn=[];G.zn.push({x,y,r,t,max:t,dps,own:p,col,slow,tick:0});}
function wolf(p,n,life){for(let i=0;i<n;i++){const a=i*2.1+Math.random();G.minions.push({x:p.x+Math.cos(a)*26,y:p.y+Math.sin(a)*26,r:10,hp:140+p.ch.lvl*6,life,atk:0,own:p,dm:p.base*1.0,col:'#9ad8ff',body:'#cfd8e0',wolf:1});}spFx('smoke',p.x,p.y,'#9ad8ff',0);}
function tauntToFriend(e,owner,dur){if(e.d.boss)return;let b=null,bd=320;for(const o of G.enemies){if(o===e||o.dead)continue;const d=dist(e,o);if(d<bd){bd=d;b=o;}}
  e.conf=dur;e.confOwner=owner;if(b){e.taunt=b;e.tauntT=dur;}}
function allyHeal(p,r,frac){for(const q of allies(p,r)){q.hp=Math.min(q.maxhp,q.hp+q.maxhp*frac);ring(q.x,q.y,36,'#7aff9a');G.fx.push({k:'txt',x:q.x,y:q.y-18,t:.7,max:.7,s:'+',col:'#7aff9a'});}}

// ----- casting hooks -----
function preCast(p,id){const s=ist(p),pr=p.pr||{};p.smod=null;if(!s.cast)s.cast={};const n=s.cast[id]=(s.cast[id]||0)+1;
  if(p.cls==='ranger'&&id==='arrow'){if(pr.ring&&n%5===0){shotMod(p,{mul:1.8,crit:1,pierce:9});spFx('eye',p.x,p.y-8,'#ffd34a',0);}if(pr.armor&&s.still>1.5){shotMod(p,{mul:1.8});s.still=0;}}
  if(p.cls==='mage'&&pr.neck&&(id==='fireball'||id==='freeze')){s.spell=(s.spell||0)+1;if(s.spell%8===0){shotMod(p,{big:1});s.free=1;toast('Starlight! A free spell.','#b06aff',2);}}
  if(p.cls==='warlock'&&pr.neck&&id==='bolt'&&(s.souls||0)>=5){s.souls=0;shotMod(p,{mul:4/1.2});toast('Soul Bolt!','#b06aff',2);}
  if(p.cls==='rogue'&&pr.armor&&s.hush&&id==='dagger'){s.hush=0;shotMod(p,{mul:3,crit:1});}
  if(p.cls==='warrior'&&pr.weapon&&id==='slash'&&n%5===0)s.cresc=1;
  if(p.cls==='priest'&&pr.weapon&&id==='smite'&&n%6===0)s.pillar=1;}
function postCast(p,id,slot){const s=ist(p),pr=p.pr||{},n=(s.cast&&s.cast[id])||0;p.smod=null;
  if(p.cls==='warrior'&&s.cresc){s.cresc=0;shoot(p,{sp:420,dmg:p.base*1.5,life:.55,pierce:9,col:'#ffe9c0',r:13});ring(p.x+p.fx*30,p.y+p.fy*30,40,'#ffe9c0');}
  if(p.cls==='paladin'&&pr.neck&&id==='guard')allyHeal(p,230,.15);
  if(p.cls==='priest'){if(pr.armor&&id==='ward')for(const q of allies(p,230))if(q.b.shield){q.b.shield.v*=1.5;q.b.shield.nova=p;}
    if(s.pillar){s.pillar=0;const x=p.x+p.fx*110,y=p.y+p.fy*110;ring(x,y,80,'#fff7c0');spFx('pillar',x,y,'#fff7c0',60);for(const q of G.players)if(!q.down&&Math.hypot(q.x-x,q.y-y)<110)q.hp=Math.min(q.maxhp,q.hp+q.maxhp*.15);for(const e of foes(x,y,80))hitE(e,p.base*2,p);}}
  if(p.cls==='ranger'&&p.rapid>0&&id==='arrow'){for(const a of[-.2,.2]){const[d,c]=pdmg(p,1);shootAng(p,{sp:560,dmg:d,crit:c,life:.9,col:'#d9c89a',r:4,k:'arrow'},a);}p.cds[slot]=.14;}
  if(p.cls==='mage'&&s.free){s.free=0;p.cds[slot]=0;}
  if(p.cls==='druid'&&pr.ring&&id==='claw'){const x=p.x+p.fx*48,y=p.y+p.fy*48;ring(x,y,20,'#7aff4a');spFx('vines',x,y,'#8aff7a',30);later(2,()=>{ring(x,y,70,'#7aff4a');spFx('vines',x,y,'#8aff7a',70);for(const e of foes(x,y,70))hitE(e,p.base,p);});}
  if(p.cls==='bard'){
    if(id==='note'){if(pr.ring&&Math.random()<.25)later(.3,()=>{if(p.down)return;const[d,c]=pdmg(p,.6);shoot(p,{sp:340,dmg:d,crit:c,life:.8,col:'#ff8ac6',r:7,taunt:true,k:'note'});});
      if(pr.weapon&&Math.random()<.12){for(let i=0;i<6;i++)G.pick.push({k:'gold',x:p.x+p.fx*20+rnd(-24,24),y:p.y+p.fy*20+rnd(-24,24),v:ri(6,12)+G.depth*2,t:0});spFx('luck',p.x,p.y,'#ffe27a',0);}}
    if(id==='song'&&pr.neck)for(const q of allies(p,240))addBuff(q,'haste',1,6);}
  if(p.cls==='rogue'){if(id==='dagger'&&pr.ring&&Math.random()<.2)for(const a of[-.22,.22]){const[d,c]=pdmg(p,.95);shootAng(p,{sp:580,dmg:d,crit:c,life:.7,col:'#cfd8e0',r:4,k:'dagger'},a);}
    if(id==='vanish'){if(pr.neck){ring(p.x,p.y,150,'#8a8aa8');for(const e of foes(p.x,p.y,150))e.slow=Math.max(e.slow||0,3);p.cds[slot]*=.7;}if(pr.armor)s.hush=1;}}}
function useAbil(p,slot){const a=CLASSES[p.cls].ab[slot];preCast(p,a.id);useAbil0(p,slot);postCast(p,a.id,slot);}

// ----- damage hooks -----
function hurtPre(p,amt,src,melee){if(p.b.inv)return-1;const pr=p.pr||{},s=ist(p);
  if(p.dr)amt*=1-p.dr/100;
  if(pr.armor){const mob=src&&src.d;
    if(p.cls==='paladin'&&Math.random()<.15){ring(p.x,p.y,36,'#ffe27a');spFx('aegis',p.x,p.y,'#ffe27a',0);if(mob)src.frozen=Math.max(src.frozen||0,1);return-1;}
    if(p.cls==='warlock'&&Math.random()<.2){spFx('smoke',p.x,p.y,'#6a5a7a',0);zone(p,p.x,p.y,60,3,0,'#6a5a7a',1);return-1;}
    if(p.cls==='bard'&&mob&&Math.random()<.15){tauntToFriend(src,p,3);spFx('notes',src.x,src.y,'#ff8ac6',0);}
    if(p.cls==='ranger'&&s.still>1.5)amt*=.75;
    if((p.cls==='warrior'||p.cls==='druid')&&s.bark&&s.barkT>0)amt*=1-.04*s.bark;}
  return amt;}
function hurtPost(p,a0,src,melee){if(a0<=0)return;const s=ist(p),pr=p.pr||{};
  if(p.cls==='warrior'&&pr.ring){s.rage=Math.min(5,(s.rage||0)+1);s.rageT=6;}
  if(pr.armor&&(p.cls==='warrior'||p.cls==='druid')){s.bark=Math.min(5,(s.bark||0)+1);s.barkT=8;if(p.cls==='warrior'&&melee&&src&&src.d)hitE(src,a0*.2,p);}
  if(p.cls==='mage'&&pr.armor&&!p.down&&p.hp>0&&a0>p.maxhp*.15&&cdOK(s,'blinkCd',45)){let d=140;const a=Math.atan2(-p.fy,-p.fx);while(d>20&&blocked(p.x+Math.cos(a)*d,p.y+Math.sin(a)*d,12))d-=20;
    spFx('smoke',p.x,p.y,'#8ad8ff',0);p.x+=Math.cos(a)*d;p.y+=Math.sin(a)*d;spFx('shards',p.x,p.y,'#8ad8ff',170);ring(p.x,p.y,170,'#8ad8ff');for(const e of foes(p.x,p.y,165)){e.frozen=3;hitE(e,p.base*.5,p);}toast('Blink Ward!','#8ad8ff',2);}}
function hurtSave(p){if(p.b.lich){p.hp=1;return true;}
  for(const q of G.players){if(q.down||q.cls!=='priest'||!(q.pr&&q.pr.neck))continue;const s=ist(q);if((s.mirCd||0)>0)continue;s.mirCd=90;p.hp=Math.max(1,p.maxhp*.3);ring(p.x,p.y,90,'#fff7c0');spFx('aegis',p.x,p.y,'#fff7c0',0);toast('Miracle! '+p.ch.name+' is saved.','#fff7c0',4);return true;}
  return false;}
function shieldNova(p,s){ring(p.x,p.y,110,'#fff7c0');const o=s.nova;for(const e of foes(p.x,p.y,105))hitE(e,(o&&o.base||p.base)*1.5,o||p);}
function projHit(pr,e){const p=pr.own;if(!p||!p.pr)return;const pr_=p.pr,k=pr.k,c=p.cls;
  if(c==='paladin'&&k==='hammer'){if(pr_.ring)e.mark=5;if(pr_.weapon)later(.45,()=>{if(!e.dead){hitE(e,p.base*.6,p);spFx('hamimp',e.x,e.y,'#fff',0);}});}
  if(c==='priest'&&pr.heal&&pr_.ring){const l=G.players.filter(q=>!q.down).sort((a,b)=>a.hp/a.maxhp-b.hp/b.maxhp);const b=3+p.ch.lvl;if(l[0])l[0].hp=Math.min(l[0].maxhp,l[0].hp+b*.5);if(l[1]){l[1].hp=Math.min(l[1].maxhp,l[1].hp+b);G.fx.push({k:'txt',x:l[1].x,y:l[1].y-18,t:.6,max:.6,s:'+',col:'#7aff9a'});}}
  if(c==='ranger'&&k==='arrow'&&pr_.weapon&&!pr.rc){let n=0;for(const o of G.enemies.map(x=>x).sort((a,b)=>dist(a,e)-dist(b,e))){if(o===e||o.dead||dist(o,e)>230)continue;hitE(o,pr.dmg*.6,p);G.fx.push({k:'bolt',x:e.x,y:e.y,x2:o.x,y2:o.y,t:.25,max:.25});if(++n>=2)break;}}
  if(c==='warlock'&&k==='bolt'&&pr_.weapon){e.dot={t:5,dps:p.base*.6,own:p,k:0};}
  if(c==='rogue'&&k==='dagger'&&pr_.weapon){e.pois=Math.min(5,(e.pois||0)+1);e.poisT=5;e.poisOwn=p;spFx('epoison',e.x,e.y,'#7aff4a',0);}}
function projBoom(pr){const p=pr.own;if(!p||!p.pr||p.cls!=='mage'||pr.k!=='fire')return;
  if(p.pr.ring&&Math.random()<.25)zone(p,pr.x,pr.y,62,3,p.base*.7,'#ff7a2a');
  if(p.pr.weapon&&!pr.sp)for(let i=0;i<3;i++){const a=i*2.094+Math.random(),sp=240;G.proj.push({x:pr.x,y:pr.y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,r:5,from:'p',own:p,life:.4,pierce:0,col:'#ff8a2a',hit:[],dmg:pr.dmg*.5,crit:false,aoe:42,k:'fire',sp:1});}}
function onKill(k,e){if(!k||!k.pr)return;const s=ist(k),pr=k.pr;
  if(k.cls==='warlock'&&pr.neck)s.souls=Math.min(5,(s.souls||0)+1);
  if(k.cls==='druid'&&pr.neck){s.kills=(s.kills||0)+1;if(s.kills%10===0){ring(e.x,e.y,100,'#7aff9a');spFx('vines',e.x,e.y,'#8aff7a',80);for(const q of G.players)if(!q.down&&Math.hypot(q.x-e.x,q.y-e.y)<200)q.hp=Math.min(q.maxhp,q.hp+q.maxhp*.2);toast('A healing bloom grows.','#7aff9a',2.5);}}
  if(s.nf&&s.nf.e===e&&s.nf.t>0){k.lcd=0;toast('Nightfall resets!','#ff9a2a',2.5);}}
function killHook(e,k){if(e.dot&&e.dot.own){let n=0;for(const o of G.enemies){if(o===e||o.dead||dist(o,e)>130)continue;o.dot={t:e.dot.t,dps:e.dot.dps,own:e.dot.own,k:0};if(++n>=2)break;}}
  onKill(k,e);}
function minionEnd(m){const p=m.own;if(p&&p.cls==='warlock'&&p.pr&&p.pr.ring&&!m.wolf&&!m.clone){ring(m.x,m.y,62,'#9a6aff');spFx('bones',m.x,m.y,'#9a6aff',34);for(const e of foes(m.x,m.y,60))hitE(e,p.base*1.5,p);}}

// ----- Legendary on-use powers -----
function useLegend(p){if(!p||p.down||!p.use||(p.lcd||0)>0)return false;const u=p.use,f=LEGFN[u.id];if(!f)return false;
  if(f(p)===false)return false;p.lcd=u.cd*p.cdm;p.lcdMax=p.lcd;toast(p.ch.name+': '+u.n+'!','#ff9a2a',3);sfx('proc');ring(p.x,p.y,120,'#ff9a2a');G.shake=Math.max(G.shake||0,6);return true;}
const LEGFN={
titanfall:p=>{let d=170;while(d>20&&blocked(p.x+p.fx*d,p.y+p.fy*d,12))d-=20;spFx('smoke',p.x,p.y,'#fff',0);p.x+=p.fx*d;p.y+=p.fy*d;spFx('eslam',p.x,p.y,'#fff',10);boom(p.x,p.y,100,p.base*4,p);for(const e of foes(p.x,p.y,105))e.frozen=Math.max(e.frozen||0,2);},
bulwark:p=>{addBuff(p,'def',.7,6);for(const e of foes(p.x,p.y,300)){if(e.d.boss)continue;e.taunt=p;e.tauntT=6;e.aggro=true;}spFx('aegis',p.x,p.y,'#ffcf6a',0);},
judgment:p=>{const L=320;ring(p.x+p.fx*L/2,p.y+p.fy*L/2,L/2,'#fff2a0');for(let d=30;d<=L;d+=40)spFx('pillar',p.x+p.fx*d,p.y+p.fy*d,'#fff2a0',30);
  for(const e of G.enemies){if(e.dead)continue;const dx=e.x-p.x,dy=e.y-p.y,t=dx*p.fx+dy*p.fy;if(t<0||t>L)continue;if(Math.abs(dx*p.fy-dy*p.fx)<e.r+26)hitE(e,p.base*5,p,true,10);}
  for(const q of G.players){if(q.down||q===p)continue;const dx=q.x-p.x,dy=q.y-p.y,t=dx*p.fx+dy*p.fy;if(t>0&&t<L&&Math.abs(dx*p.fy-dy*p.fx)<40)q.hp=Math.min(q.maxhp,q.hp+q.maxhp*.3);}},

  for(const [g] of GROLES)if(typeof o.k[g]==='string'&&o.k[g].length<24)KEYS[g]=o.k[g];}catch(e){}}

// ---------- WebRTC star room ----------
const RTC_CFG={iceServers:CFG.stun.length?[{urls:CFG.stun}]:[]};
let HR=null;      // hosted room state
let ROOM=null;    // active room core (host or client)
function mkPC(){return new RTCPeerConnection(RTC_CFG);}
function relayIce(pc,dst,cid){pc.onicecandidate=e=>{if(e.candidate)brSend(dst,'CANDIDATE',{kv:'rtc-ice',cid,cand:e.candidate.toJSON?e.candidate.toJSON():e.candidate});};}
const PEND={};    // cid -> {pc,pending ICE}
function onRtcSignal(src,type,p){const c=PEND[p.cid];if(!c||c.dst!==src)return;

  else if(type==='ANSWER'&&p.kv==='rtc-deny'){c.deny&&c.deny(p.why||'denied');}
  else if(type==='CANDIDATE'&&p.cand){if(c.rd||c.hostSide&&c.pc.remoteDescription)c.pc.addIceCandidate(p.cand).catch(()=>{});else(c.q=c.q||[]).push(p.cand);}}

// host side: accept an incoming rtc offer from a friend
async function hostOnOffer(src,p,f){

  if(Object.keys(HR.members).length>=3){brSend(src,'ANSWER',{kv:'rtc-deny',cid:p.cid,why:'The room is full.'});return;}
  const pc=mkPC(),cid=p.cid,mem={pc,dc:null,ready:false,at:Date.now(),presence:{},upd:Date.now()};HR.members[src]=mem;

  pc.ondatachannel=e=>{const dc=e.channel;mem.dc=dc;dc.onmessage=ev=>hostGot(src,mem,ev.data);dc.onclose=()=>hostDrop(src,mem);};
  pc.onconnectionstatechange=()=>{if(pc.connectionState==='failed'||pc.connectionState==='closed')hostDrop(src,mem);};
  try{await pc.setRemoteDescription({type:'offer',sdp:p.sdp});const an=await pc.createAnswer();await pc.setLocalDescription(an);brSend(src,'ANSWER',{kv:'rtc-ans',cid,sdp:an.sdp});
    (PEND[cid].q||[]).forEach(x=>pc.addIceCandidate(x).catch(()=>{}));}catch(e){hostDrop(src,mem);}
  setTimeout(()=>{if(!mem.ready&&HR&&HR.members[src]===mem)hostDrop(src,mem);delete PEND[cid];},20000);}
function dcSend(dc,o){try{if(dc&&dc.readyState==='open')dc.send(JSON.stringify(o));}catch(e){}}
function hostGot(src,mem,raw){let m;try{m=JSON.parse(raw);}catch(e){return;}if(!m||typeof m!=='object')return;mem.at=Date.now();
  if(m.t==='hello'){const f=findF(src);if(!f||f.st!=='ok'){dcSend(mem.dc,{t:'deny',why:'You are not on the host\'s friends list.'});setTimeout(()=>hostDrop(src,mem),300);return;}
    if(m.ver!==KOV_VER){dcSend(mem.dc,{t:'deny',why:'Version mismatch: host has v'+KOV_VER+', you have v'+String(m.ver).slice(0,12)+'. Update the game.'});setTimeout(()=>hostDrop(src,mem),300);return;}
    mem.ready=true;mem.presence={};mem.upd=Date.now();dcSend(mem.dc,{t:'welcome',me:src,host:HR.id});HR.core.changed();hostBroadcastPeers();return;}

function mergeP(base,patch){const o=Object.assign({},base);for(const k of Object.keys(patch)){if(!/^[A-Za-z_][A-Za-z0-9_-]{0,63}$/.test(k)||k==='prototype'||k==='__proto__'||k==='constructor')continue;if(patch[k]===null)delete o[k];else o[k]=patch[k];}return o;}

function hostPeerList(){const l=[{p:HR.id,presence:HR.core.selfPres,upd:HR.core.selfUpd}];for(const id of Object.keys(HR.members)){const m=HR.members[id];if(m.ready)l.push({p:id,presence:m.presence,upd:m.upd});}return l;}

// ---------- room core: same API the game already uses (join/emit/on/presence/onPeers/leave) ----------
function makeCore(selfId,isHost){

  c.list=()=>{const out=[];const add=(id,pr,upd)=>{out.push(Object.freeze({peer:id,by:null,isMe:id===selfId,sameTab:id===selfId,kind:'viewer',guest:false,presence:Object.freeze(pr||{}),updatedAt:upd||0}));};
    if(isHost){add(selfId,c.selfPres,c.selfUpd);for(const id of Object.keys(HR.members)){const m=HR.members[id];if(m.ready)add(id,m.presence,m.upd);}}
    else{add(selfId,c.selfPres,c.selfUpd);Object.keys(c.peersMap).forEach(id=>{if(id!==selfId)add(id,c.peersMap[id].presence,c.peersMap[id].upd);});}

function roomApi(core,sendEmit,sendPres,leave){
  return{name:core.name,
    emit(topic,data){if(core.left)return Promise.reject({code:'invalid_argument',message:'left'});if(typeof topic!=='string'||!/^[a-z][a-z0-9_.-]{0,47}$/.test(topic))return Promise.reject({code:'invalid_argument',message:'topic'});

    presence(patch){if(core.left)return Promise.reject({code:'invalid_argument',message:'left'});core.selfPres=mergeP(core.selfPres,patch||{});core.selfUpd=Date.now();core.changed();sendPres(patch||{});return Promise.resolve();},
    peers(){return core.snapshot;},
    onPeers(fn,onErr){const h={fn,onErr};core.peerHandlers.push(h);Promise.resolve().then(()=>{core.prev={};core.changed();});return()=>{const i=core.peerHandlers.indexOf(h);if(i>=0)core.peerHandlers.splice(i,1);};},
    connected(){return core.conn;},
    onConnection(fn){core.connHandlers.push(fn);Promise.resolve().then(()=>fn(core.conn));return()=>{const i=core.connHandlers.indexOf(fn);if(i>=0)core.connHandlers.splice(i,1);};},
    leave(){if(core.left)return Promise.resolve();core.left=true;leave();return Promise.resolve();}};}
function setConn(core,v){if(core.conn===v)return;core.conn=v;core.connHandlers.slice().forEach(f=>{try{f(v);}catch(e){}});}

async function joinHost(name){
  const id=myId();if(!id)throw{code:'upstream_error',message:'no identity'};
  if(!BR.ok)throw{code:'upstream_error',message:BR.err==='taken'?'Your name is online on another PC.':'Not connected to the matchmaker yet.'};
  leaveRoom();
  const core=makeCore(id,true);core.name=name;HR={id,core,members:{},dirty:{},pt:0};ROOM={core,host:true};
  const api=roomApi(core,(topic,data)=>hostSendAll({t:'m',topic,data,from:id}),patch=>{HR.dirty[id]=1;hostPresFlush();},()=>leaveRoom());
  core.hbT=setInterval(()=>{if(!HR)return;const now=Date.now();for(const mid of Object.keys(HR.members)){const m=HR.members[mid];if(m.ready&&now-m.at>30000)hostDrop(mid,m);}},3000);
  core.changed();return api;}
async function joinClient(name,hostId){
  const id=myId();if(!id)throw{code:'upstream_error',message:'no identity'};

  leaveRoom();
  const core=makeCore(id,false);core.name=name;core.hostId=hostId;const cid=Math.random().toString(36).slice(2,12),pc=mkPC();
  const ent=PEND[cid]={pc,dst:hostId,q:[],rd:false};relayIce(pc,hostId,cid);

  const fail=await new Promise(resolve=>{let done=false;const fin=r=>{if(!done){done=true;clearTimeout(t);resolve(r);}};const t=setTimeout(()=>fin({code:'upstream_error',message:'The host did not answer. They may be offline or behind a strict router.'}),15000);

      if(m.t==='welcome'){core.ready=true;fin(null);return;}

function clientGot(core,m){

  else if(m.t==='pres'&&typeof m.p==='string'){if(m.p===core.selfId)return;core.peersMap[m.p]={presence:m.presence&&typeof m.presence==='object'?m.presence:{},upd:+m.upd||0};core.changed();}
  else if(m.t==='m'&&typeof m.topic==='string'&&m.from!==core.selfId){core.deliver(m.topic,m.data,m.from);}}

    '<p class="dim" id="brst">'+esc(brStatusText())+'</p><p style="margin:2px 0">Your friend ID: <b style="color:var(--parch)">'+esc(label(FD.me))+'</b> <button class="btn alt" data-a="fcopy" style="padding:2px 10px">Copy</button></p>'+
    '<div class="row"><button class="btn big" data-a="nhost">Host a Game</button></div>'+
    '<div class="sheet" style="max-height:230px;overflow:auto"><h3 style="margin:0 0 4px">Friends</h3><div id="frl">'+friendRows()+'</div></div>'+
    '<div class="row"><input type="text" id="fadd" maxlength="18" placeholder="Name#1234" style="width:160px;text-align:center"><button class="btn alt" data-a="fadd">Add Friend</button></div>'+
    '<p class="dim" id="fmsg">'+esc(NET.msg||'')+'</p><div class="row"><button class="btn alt" data-a="nback">Change Hero</button><button class="btn alt" data-a="title">Back</button></div></div>');
  NET.msg='';pollFriends();}
deskMenu=deskMenuFn;
function fmsg(t){const e=document.getElementById('fmsg');if(e)e.textContent=t;}
ACT.fadd=()=>{const e=document.getElementById('fadd'),t=parseTag(e&&e.value);if(!t){fmsg('Type a friend ID like Alice#1234.');return;}
  const id=slug(t.name,t.num);if(id===myId()){fmsg('That is you.');return;}
  const f=findF(id);if(f){fmsg('Already on your list.');return;}if(FD.friends.length>=60){fmsg('Friends list is full.');return;}
  FD.friends.push({name:t.name,num:t.num,st:'sent'});saveFD();e.value='';fmsg(BR.ok?'Request sent. Your friend must be online and open Play Online to accept it.':'Saved, but you are not connected to the matchmaker yet. It will send when you are online.');hubRefresh();pollFriends();};
ACT.faccept=d=>{const f=FD.friends[+d.i];if(!f||f.st!=='recv')return;f.st='ok';saveFD();brSend(slug(f.name,f.num),'OFFER',{kv:'facc',from:FD.me});hubRefresh();pingFriend(f);};
ACT.fremove=d=>{const f=FD.friends[+d.i];if(!f)return;FD.friends.splice(+d.i,1);saveFD();hubRefresh();};
ACT.fcopy=()=>{try{navigator.clipboard.writeText(label(FD.me));fmsg('Copied '+label(FD.me));}catch(e){}};
ACT.fjoin=d=>{const f=FD.friends[+d.i];if(f)deskJoin(slug(f.name,f.num));};
ACT.finvite=d=>{const f=FD.friends[+d.i];if(!f)return;brRequest(slug(f.name,f.num),{kv:'invite',from:FD.me},6000).then(()=>fmsg('Invite sent to '+label(f)+'.')).catch(()=>fmsg(label(f)+' is not reachable.'));};
function deskInviteAll(){FD.friends.filter(f=>f.st==='ok'&&FST[slug(f.name,f.num)]&&FST[slug(f.name,f.num)].on).forEach(f=>brSend(slug(f.name,f.num),'OFFER',{kv:'invite',from:FD.me}));}
ACT.nhost=()=>{if(!FD.me){identityScreen();return;}netEnter(true,'p2p');};
ACT.ninvite=d=>{const f=FD.friends[+d.i];if(!f)return;brSend(slug(f.name,f.num),'OFFER',{kv:'invite',from:FD.me});};
deskLobbyExtra=function(){if(!NET.host)return'';const on=FD.friends.filter(f=>f.st==='ok'&&FST[slug(f.name,f.num)]&&FST[slug(f.name,f.num)].on);
  if(!on.length)return'<p class="dim">Friends who are online can be invited here. Or they can open Play Online and press Join next to your name.</p>';
  return'<div class="sheet"><h3 style="margin:0 0 4px">Invite a friend</h3>'+on.map(f=>'<div style="display:flex;gap:8px;align-items:center;margin:3px 0"><b style="min-width:140px;text-align:left">'+esc(label(f))+'</b><button class="btn alt" data-a="ninvite" data-i="'+FD.friends.indexOf(f)+'">Invite</button></div>').join('')+'</div>';};
let pendingJoin=null;
function deskOpenHub(){if(NET.myCh)deskMenuFn();else netHeroScreen();}
async function deskJoin(hostSlug){if(!NET.myCh){pendingJoin=hostSlug;netHeroScreen();return;}
  const f=findF(hostSlug);NET.target=hostSlug;await netEnter(false,'p2p');}

// ---------- version + update button ----------
let upd=null,vEl=null;
function vRender(){if(!vEl){vEl=document.createElement('div');vEl.style.cssText='position:fixed;left:10px;bottom:8px;z-index:99998;font:600 12px Georgia,serif;color:#cdbf9a;text-shadow:0 1px 2px #000;display:flex;gap:8px;align-items:center';document.body.appendChild(vEl);}
  vEl.innerHTML='<span>Eredon KoV v'+KOV_VER+'</span>';
  if(upd&&upd.available){const b=document.createElement('button');b.className='btn';b.style.cssText='padding:3px 10px;margin:0;font-size:12px';b.textContent='Update available: v'+upd.latest+' - click to update';b.onclick=doUpdate;vEl.appendChild(b);}
  else if(upd&&upd.error&&upd.manual){const s=document.createElement('span');s.textContent=upd.error;vEl.appendChild(s);}}
async function checkUpdate(manual){try{upd=await window.kovDesk.checkUpdate();}catch(e){upd={error:'Could not check for updates.'};}vRender();return upd;}
async function doUpdate(){if(G&&G.players&&!G.over){if(!confirm('Updating will close the current run. Continue?'))return;}if(vEl)vEl.innerHTML='<span>Updating... the game will restart.</span>';try{const r=await window.kovDesk.applyUpdate();if(r&&r.error){upd={error:r.error,manual:1};vRender();}}catch(e){upd={error:'Update failed.',manual:1};vRender();}}
function updText(){if(!upd)return'Checking for updates...';if(upd.available)return'A new version is ready: v'+upd.latest;if(upd.error)return upd.error;return'You have the latest version.';}
deskSettings=function(){return'<section><h3>Game Version</h3><p style="margin:4px 0">Eredon KoV <b>v'+KOV_VER+'</b></p><p class="dim" id="updst" style="margin:4px 0">'+esc(updText())+'</p><div class="row"><button class="btn alt" data-a="updcheck">Check for Updates</button>'+(upd&&upd.available?'<button class="btn" data-a="updapply">Update to v'+esc(String(upd.latest))+'</button>':'')+'</div></section>';};
ACT.updcheck=async()=>{upd=null;settingsScreen();await checkUpdate(true);if(document.getElementById('updst'))settingsScreen();};
ACT.updapply=()=>{doUpdate();};
vRender();checkUpdate();setInterval(checkUpdate,15*60*1000);
if(FD.me)brConnect();
window.__kovP2P={deskJoin,BR,FD,slug,label,leaveRoom,get HR(){return HR;},FST,pollFriends,brConnect};
})();
titleScreen();requestAnimationFrame(frame);
renderHints();
</script>
